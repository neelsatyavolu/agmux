<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Colors · Semantic" subtitle="Status pills: running/done/error/pending/stopped" viewport="700x200" -->
<html lang="en" data-surface="app">
<head>
<meta charset="UTF-8">
<title>Xanom — Semantic Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; background:#111113; }
  .card { width:700px; padding:24px; background:#0a0a0b; color:#fff; box-sizing:border-box; font-family: var(--font-sans); letter-spacing:-0.015em; }
  .label { font-size:11px; font-family:var(--font-mono); color:#71717a; text-transform:uppercase; letter-spacing:0.2em; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; }
  .pill { display:inline-flex; align-items:center; gap:4px; border-radius:9999px; padding:2px 10px; font-size:10.5px; font-weight:500; font-family:var(--font-sans); letter-spacing:-0.01em; justify-content:center; }
  .pill-running { background:rgba(245,158,11,0.10); border:1px solid rgba(245,158,11,0.25); color:rgb(251,191,36); }
  .pill-done    { background:rgba(52,211,153,0.10); border:1px solid rgba(52,211,153,0.20); color:rgb(52,211,153); }
  .pill-error   { background:rgba(239,68,68,0.10); border:1px solid rgba(239,68,68,0.20); color:rgb(248,113,113); }
  .pill-pending { background:rgba(96,165,250,0.10); border:1px solid rgba(96,165,250,0.20); color:rgb(96,165,250); }
  .pill-stopped { background:rgba(161,161,170,0.10); border:1px solid rgba(161,161,170,0.20); color:rgb(161,161,170); }
  .col { display:flex; flex-direction:column; gap:6px; align-items:stretch; text-align:center; }
  .role { font-size:10px; color:#71717a; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.15em; }
  .hex { font-size:10px; color:#52525b; font-family:var(--font-mono); margin-top:2px; }
  .dot { display:inline-block; width:5px; height:5px; border-radius:9999px; background:currentColor;}
</style>
</head>
<body>
<div class="card">
  <div class="label">Status · Semantic pills</div>
  <div class="grid">
    <div class="col"><span class="pill pill-running"><span class="dot"></span>Running</span><span class="role">warn</span><span class="hex">amber-400</span></div>
    <div class="col"><span class="pill pill-done"><span class="dot"></span>Done</span><span class="role">ok</span><span class="hex">emerald-400</span></div>
    <div class="col"><span class="pill pill-error"><span class="dot"></span>Error</span><span class="role">error</span><span class="hex">red-400</span></div>
    <div class="col"><span class="pill pill-pending"><span class="dot"></span>Pending</span><span class="role">info</span><span class="hex">blue-400</span></div>
    <div class="col"><span class="pill pill-stopped"><span class="dot"></span>Stopped</span><span class="role">muted</span><span class="hex">zinc-400</span></div>
  </div>
  <div style="margin-top:18px; font-size:12px; color:#a1a1aa; line-height:1.5;">
    Recipe: <span style="color:#e4e4e7;">10% bg · 20–25% border · 100% text</span>. Always rounded-full. 10.5px font, medium weight.
  </div>
</div>
</body>
</html>
